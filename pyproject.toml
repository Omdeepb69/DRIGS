[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drigs"
version = "0.1.0"
description = "Distributed Resource & Intelligent GPU Scheduling runtime for AI workloads"
readme = "README.md"
authors = [
    { name = "DRIGS Team", email = "drigs@example.com" }
]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["gpu", "scheduling", "distributed-computing", "deep-learning", "pytorch", "cluster-management"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "httpx>=0.24.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "uvicorn>=0.20.0",
    "fastapi>=0.100.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Omdeepb69/drigs"
Documentation = "https://github.com/Omdeepb69/drigs#readme"
Repository = "https://github.com/Omdeepb69/drigs.git"
Issues = "https://github.com/Omdeepb69/drigs/issues"

[project.scripts]
drigs = "drigs.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["drigs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-p no:launch_testing"



